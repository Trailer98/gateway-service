server:
  port: ${GATEWAY_SERVER_PORT:8082}

spring:
  application:
    name: gateway-service

  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        service: ${spring.application.name}
        namespace: ${NACOS_NAMESPACE_ID}
        group: DEFAULT_GROUP

      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE_ID}
        group: GATEWAY_GROUP

  config:
    import:
      - nacos:gateway-service.yaml?group=GATEWAY_GROUP&refreshEnabled=true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    gateway:
      access: unrestricted

gateway:
  internal-token: ${GATEWAY_INTERNAL_TOKEN}