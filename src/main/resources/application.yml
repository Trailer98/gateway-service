server:
  port: 8082

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        service: ${spring.application.name}
        namespace: public
        group: DEFAULT_GROUP
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
            - id: wms-admin
              uri: lb://wms-admin
              predicates:
                - Path=/api/wms/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted

gateway:
  internal-token: local-dev-gateway-token
  auth:
    token-validation-uri: http://auth-service/auth/internal/token/validate
    token-validation-timeout: 3s
    whitelist-paths:
      - /api/auth/login
      - /api/auth/refresh
      - /actuator/**
      - /favicon.ico
